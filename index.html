<!DOCTYPE html>

<html lang=”en”>
    <head>
        <title>rdd</title>

        <style>
            @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap');

            :root {
                color-scheme: dark light;
            }

            body {
                font-family: 'JetBrains Mono', monospace;
            }

            form {
                border-width: thin;
                border-style: solid;
                border-radius: 4px;
                margin-left: 10px;
                width: fit-content;
                padding: 18px 18px 18px 18px;
                line-height: 24px;
            }

            output {
                white-space: pre-wrap;
            }

            button {
                font-weight: normal;
            }

            a:link {
                color: rgb(43, 162, 241);
                font-weight: bolder;
            }

            a:visited {
                color: rgb(43, 162, 241);
                font-weight: bolder;
            }
        </style>
    </head>

    <body>
        <noscript><p>&#40;This site doesn't work without JavaScript Enabled!&#41;</p></noscript>

        <div hidden id="downloadFormDiv">
            <form id="downloadForm" target="_blank" action="">
                <label for="binaryType">binary type:</label>
                <select id="binaryType" name="binaryType">
                    <option value="WindowsPlayer">windows player</option>
                    <option value="WindowsStudio64">windows studio</option>
                    <option value="MacPlayer">macOS player</option>
                    <option value="MacStudio">macOS studio</option>
                </select>
                <br>
                <label for="arch">arch:</label>
                <select id="arch" name="arch"></select>
                <br>
                <label for="channel">channel:</label>
                <input id="channel" name="channel" type="text" placeholder="LIVE">
                <br>
                <label for="version">version hash:</label>
                <input id="version" name="version" type="text"> <b>&#40;Optional&#41;</b>
                <br><br>
                <label for="compressZip">compress zip:</label>
                <input id="compressZip" name="compressZip" type="checkbox">
                <br>
                <label for="compressionLevel">compression level (1-9):</label>
                <input id="compressionLevel" name="compressionLevel" type="number" min="1" max="9" value="5">
                <br><br>
                <button type="button" onclick="downloadFromForm();">download</button>
                <button type="button" onclick="copyPermLink();">copy link</button>
                <br>
            </form>
            <br>
        </div>

        <output id="consoleText"></output>
        <br>
    </body>

    <script src="js/jszip.min.js"></script>
    <script src="js/rdd.js"></script>
</html>
